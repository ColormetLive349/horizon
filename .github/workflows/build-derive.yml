name: Build horizon-derived.zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download official server.jar
        run: curl -L "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar" -o server.jar

      - name: Prepare derived assets
        run: cargo run --release -p horizon-prepare -- --prepare --server-jar server.jar

      - name: Package zip
        run: bash packaging/android/make_derived_pack.sh

      - name: Upload horizon-derived.zip
        uses: actions/upload-artifact@v4
        with:
          name: horizon-derived
          path: target/android/horizon-derived.zip
